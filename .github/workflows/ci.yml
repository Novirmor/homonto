name: ci

on:
  push:
  pull_request:

# Least-privilege by default: CI only reads the repo.
permissions:
  contents: read

jobs:
  # One shared gate drives CI, local rehearsal, and release publication
  # (scripts/gate.sh), so no path runs a weaker check set than another. It
  # covers gofmt, mod-tidy, vet, build, shell syntax, test, race, version
  # stamp, the read-only smoke, release packaging, the documentation and
  # whole-program security suites, 30s of fuzzing per target, and
  # govulncheck.
  #
  # Both platforms, every push: Homonto's filesystem layer is written
  # against fd-anchored syscalls that differ between Linux and macOS, and
  # a divergence there is not something to discover at release time.
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned by commit rather than tag: a tag is mutable, and an action
      # that can change under us runs with access to this repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Match go.mod's pinned toolchain. Provisioning an older Go lets
          # `go run govulncheck@latest` downgrade to a toolchain that
          # cannot parse the stdlib sources the pinned one pulls in.
          go-version: "1.26.6"
          check-latest: true
      - name: gate
        run: ./scripts/gate.sh
