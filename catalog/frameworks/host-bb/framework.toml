manifest_schema = 2
name = "host-bb"
kind = "service"
version = "0.1.0"
description = "Bitbucket Cloud service: pull request reads, homonto drafts and publication through homonto's own transport"

# The draft/publication core runs in the homonto binary (ADR 0090); this
# service enables its Bitbucket provider. The transport is homonto's
# `homonto host bitbucket api` (ADR 0091), authenticated by
# HOMONTO_BITBUCKET_TOKEN (optionally HOMONTO_BITBUCKET_EMAIL for Basic).
[service]
id = "bitbucket"
runtime = "bitbucket"
operations = ["read", "draft", "publish"]
transport = "homonto host bitbucket api"
credentials = [
  { kind = "env", name = "HOMONTO_BITBUCKET_TOKEN" },
  { kind = "cli", check = "homonto host bitbucket auth status" },
]

[requires]
harness = ["question-dialog"]

# No [permissions]: the coordinator baseline asks before any DELETE through
# the transport and implementers deny `homonto *` (ADR 0091, ADR 0094).
