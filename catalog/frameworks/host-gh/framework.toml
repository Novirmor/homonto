manifest_schema = 2
name = "host-gh"
kind = "service"
version = "0.1.0"
description = "GitHub service: issue and pull request reads, homonto drafts and publication through gh"

# The draft/publication core runs in the homonto binary (ADR 0090); this
# service enables its GitHub provider. Publication approval goes through the
# harness's native question dialog.
[compat]
contract = "1.0"

[service]
id = "github"
runtime = "github"
operations = ["read", "draft", "publish"]
transport = "gh"
credentials = [{ kind = "cli", check = "gh auth status" }]

[requires]
harness = ["question-dialog"]

# No [permissions]: the coordinator and implementer baselines already ask for
# destructive gh commands and deny gh publication to workers, because engines
# deliver through gh even when no service is installed (ADR 0094).
