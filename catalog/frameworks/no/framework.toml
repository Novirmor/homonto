manifest_schema = 2
name = "no"
kind = "engine"
version = "0.3.0"
description = "Minimal model-directed development and review engine"

[compat]
contract = "1.0"

[engine]
lifecycle = "stateless"
entry = ["no"]
operations = ["start", "resume", "integration-check", "release"]
stages = ["implement", "review"]

# Which stage each worker serves (ADR 0099).
[engine.agent_stages]
no-implementer = ["implement"]
no-reviewer = ["review"]

[requires]
harness = ["skills", "commands", "subagents", "question-dialog"]

# Read by the no execution reference through `homonto explain settings no
# --json` (ADR 0095).
[settings.isolation]
type = "string"
enum = ["ask", "existing", "worktree"]
default = "ask"
description = "Checkout isolation for a new no task: ask once, or always use existing checkouts or worktrees"

[dependencies]
frameworks = []

[skills]
no = "skills/no"

[commands]
no = "commands/no.md"

[subagents]
no-implementer = "subagents/no-implementer.md"
no-reviewer = "subagents/no-reviewer.md"
