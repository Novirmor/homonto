manifest_schema = 2
name = "no"
kind = "engine"
version = "0.3.0"
description = "Minimal model-directed development and review engine"

[engine]
lifecycle = "stateless"
entry = ["no"]
operations = ["start", "resume", "integration-check", "release"]
stages = ["implement", "review"]

[requires]
harness = ["skills", "commands", "subagents", "question-dialog"]

[dependencies]
frameworks = []

[skills]
no = "skills/no"

[commands]
no = "commands/no.md"

[subagents]
no-implementer = "subagents/no-implementer.md"
no-reviewer = "subagents/no-reviewer.md"
