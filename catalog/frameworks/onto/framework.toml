manifest_schema = 2
name = "onto"
kind = "engine"
version = "0.28.0"
description = "Onto self-contained development workflow"

[engine]
lifecycle = "native"
binary = "onto"
entry = ["onto"]
operations = ["start", "resume", "integration-check", "release"]
stages = ["open", "design", "build", "verify", "close"]
coordinator = "shared"

# Which stages each specialist serves (ADR 0099). A stage routing policy
# reaches an agent through this binding.
[engine.agent_stages]
onto-explorer = ["open", "design", "build", "verify"]
onto-implementer = ["build", "verify"]
onto-reviewer = ["build"]
onto-skeptic = ["verify"]

[requires]
harness = ["skills", "commands", "subagents", "agent-tool-limits", "shell-rules", "question-dialog", "context-hooks", "permission-events"]

[dependencies]
frameworks = []

[skills]
onto = "skills/onto"
onto-build = "skills/onto-build"
onto-close = "skills/onto-close"
onto-design = "skills/onto-design"
onto-open = "skills/onto-open"
onto-light = "skills/onto-light"
onto-verify = "skills/onto-verify"
onto-no-slop = "skills/onto-no-slop"

[commands]
onto = "commands/onto.md"
onto-bypass = "commands/onto-bypass.md"
onto-open = "commands/onto-open.md"
onto-design = "commands/onto-design.md"
onto-build = "commands/onto-build.md"
onto-verify = "commands/onto-verify.md"
onto-close = "commands/onto-close.md"
onto-light = "commands/onto-light.md"
onto-no-slop = "commands/onto-no-slop.md"

# The onto skills delegate to these specialist subagents (see the dispatcher
# skill's "Delegation" section). The primary coordinator is the shared
# `homonto` agent (coordinator = "shared" above, ADR 0045, ADR 0092); every
# workflow command routes into it. Shipping them with the framework means installing onto connects
# the whole team; do NOT also declare them in a top-level [subagents.*] table
# (that collides with the framework declaration). Every specialist is
# namespaced `onto-*`, so installing onto never collides with another
# framework's — or your own — agent of the same generic name.
[subagents]
onto-explorer = "subagents/onto-explorer.md"
onto-reviewer = "subagents/onto-reviewer.md"
onto-implementer = "subagents/onto-implementer.md"
onto-skeptic = "subagents/onto-skeptic.md"
