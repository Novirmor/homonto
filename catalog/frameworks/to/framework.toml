manifest_schema = 2
name = "to"
kind = "engine"
version = "0.25.0"
description = "to — minimal coding framework for LLMs (plan → do → done)"

[compat]
contract = "1.0"

[engine]
lifecycle = "native"
binary = "to"
entry = ["to"]
operations = ["start", "resume", "integration-check", "release"]
stages = ["plan", "do", "done"]
coordinator = "shared"

# Which stages each specialist serves (ADR 0099). A stage routing policy
# reaches an agent through this binding.
[engine.agent_stages]
to-explorer = ["plan", "do"]
to-implementer = ["do", "done"]
to-reviewer = ["do"]
to-skeptic = ["done"]

[requires]
harness = ["skills", "commands", "subagents", "agent-tool-limits", "shell-rules", "question-dialog", "context-hooks", "permission-events"]

[dependencies]
frameworks = []

[skills]
to = "skills/to"
to-plan = "skills/to-plan"
to-do = "skills/to-do"
to-done = "skills/to-done"
to-no-slop = "skills/to-no-slop"

[commands]
to = "commands/to.md"
to-bypass = "commands/to-bypass.md"
to-plan = "commands/to-plan.md"
to-do = "commands/to-do.md"
to-done = "commands/to-done.md"
to-no-slop = "commands/to-no-slop.md"

# The to skills delegate to these specialist subagents — onto's cast, adapted.
# Concurrency follows write-scope (ADR 0019): the three read-only agents run
# as concurrently as the work allows; implementers run across independent repos,
# with exactly one assigned repository and one writer per checkout (ADR 0068). The
# primary coordinator is the shared `homonto` agent (coordinator = "shared"
# above, ADR 0045, ADR 0092); every workflow command routes into it. Every
# specialist is namespaced `to-*`, so installing to never collides with
# another framework's — or your own — agent of the same generic name. Do NOT
# also declare them in a top-level [subagents.*] table. onto and to are
# complementary: declare either or both and pick per change.
[subagents]
to-explorer = "subagents/to-explorer.md"
to-implementer = "subagents/to-implementer.md"
to-reviewer = "subagents/to-reviewer.md"
to-skeptic = "subagents/to-skeptic.md"
