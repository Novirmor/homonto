# The published release of this reference set: the one the E2E `reference`
# cell (test/e2e/suites/reference.sh) installs over https.
#
# `digest` is homonto's content pin (internal/remote.CanonicalDigest): it
# depends only on paths, bytes and exec bits, so it equals the pin of the
# in-repo copy beside this file. TestReferenceSetMatchesItsPublishedPins fails
# when the two drift; `task reference-published` re-checks the live release
# assets. To change a package: change it here and in the published repository,
# cut a new tag there, and move this file to that tag in the same commit.
# `archive_sha256` is the release asset's byte hash, for reference only.
