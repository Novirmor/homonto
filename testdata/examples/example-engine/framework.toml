manifest_schema = 2
name = "example-engine"
kind = "engine"
version = "0.1.0"
description = "Example stateless engine: one entry skill, one read-only worker"

[compat]
contract = "1.0"

[engine]
lifecycle = "stateless"
entry = ["example-engine"]
operations = ["start", "resume", "integration-check", "release"]
stages = ["implement", "review"]

[engine.agent_stages]
example-reviewer = ["review"]

[requires]
harness = ["skills", "commands", "subagents", "agent-tool-limits", "question-dialog"]

[settings.review]
type = "string"
enum = ["always", "on-request"]
default = "always"
description = "When the worker reviews the candidate"

[skills]
example-engine = "skills/example-engine"

[commands]
example-engine = "commands/example-engine.md"

[subagents]
example-reviewer = "subagents/example-reviewer.md"
