manifest_schema = 2
name = "example-workflow"
kind = "workflow"
version = "0.1.0"
description = "Example workflow: triage a tracker issue, then hand it to an installed engine"

[compat]
contract = "1.0"

[workflow]
coordinator = "shared"
entry = ["example-triage"]

[requires]
harness = ["skills", "commands", "subagents", "question-dialog"]

# The tracker service comes from example-service, which a config must
# declare: a default that is not builtin is never installed implicitly.
[requires.services]
tracker = "example-service"

# The skill classifies each issue with a typed decision at the point
# example-workflow.classify (choice: bug, feature, question) and runs the
# process of that name. A config routes the point under [decisions]
# (docs/contracts/decisions.md).
[processes]
description = "Named triage processes, one per decision class: bug, feature, question"

[processes.fields.steps]
type = "list"
required = true

[skills]
example-triage = "skills/example-triage"

[commands]
example-triage = "commands/example-triage.md"
